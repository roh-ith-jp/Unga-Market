<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149A46"/>
      <stop offset="100%" stop-color="#0A6B2E"/>
    </linearGradient>
    <linearGradient id="ungaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#139543"/>
      <stop offset="100%" stop-color="#085F27"/>
    </linearGradient>
    <linearGradient id="marketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E14"/>
      <stop offset="100%" stop-color="#D92200"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#F25B00"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background is transparent -->
  <g id="logo-root" filter="url(#drop)">
    <!-- LEFT: GROCERY CART WITH FRESH PRODUCE -->
    <g transform="translate(10, 20)">
      <!-- Speed Motion Lines behind cart -->
      <path d="M 40 180 L 110 180" stroke="#0F8A3E" stroke-width="14" stroke-linecap="round"/>
      <path d="M 20 225 L 95 225" stroke="#0F8A3E" stroke-width="14" stroke-linecap="round"/>
      <path d="M 45 270 L 105 270" stroke="#0F8A3E" stroke-width="14" stroke-linecap="round"/>

      <!-- Groceries inside Cart -->
      <!-- Green lettuce/kale -->
      <path d="M 120 120 C 130 50, 190 60, 210 110 C 230 40, 280 60, 290 120 Z" fill="#2E7D32"/>
      <path d="M 140 100 C 155 30, 210 40, 235 90 C 265 25, 305 50, 310 115 Z" fill="#4CAF50"/>
      
      <!-- Carrot with green top -->
      <g transform="translate(130, 85) rotate(-25)">
        <!-- Green stem -->
        <path d="M 25 15 C 20 -15, 35 -15, 30 15 M 30 15 C 35 -20, 50 -10, 35 15" stroke="#2E7D32" stroke-width="4" fill="none"/>
        <!-- Orange body -->
        <path d="M 15 15 Q 35 10 45 15 L 30 110 Z" fill="#FF5722"/>
      </g>

      <!-- French Baguette Bread -->
      <g transform="translate(250, 20) rotate(32)">
        <rect x="0" y="0" width="54" height="150" rx="27" fill="#E0A96D"/>
        <!-- Slits -->
        <line x1="12" y1="35" x2="42" y2="48" stroke="#8D5B28" stroke-width="4" stroke-linecap="round"/>
        <line x1="12" y1="65" x2="42" y2="78" stroke="#8D5B28" stroke-width="4" stroke-linecap="round"/>
        <line x1="12" y1="95" x2="42" y2="108" stroke="#8D5B28" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Milk Bottle -->
      <g transform="translate(285, 75)">
        <rect x="10" y="0" width="22" height="16" rx="4" fill="#0288D1"/>
        <path d="M 12 16 L 30 16 L 40 40 L 40 105 L 2 105 L 2 40 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
        <rect x="2" y="55" width="38" height="25" fill="#0288D1"/>
      </g>

      <!-- Yellow Banana bunch -->
      <path d="M 215 145 C 235 125, 275 135, 285 185 C 275 190, 245 180, 215 145 Z" fill="#FBC02D"/>
      <path d="M 225 155 C 245 135, 285 145, 295 195 C 285 200, 255 190, 225 155 Z" fill="#FDD835"/>

      <!-- Yellow Bell Pepper -->
      <circle cx="225" cy="140" r="28" fill="#FBC02D"/>
      <path d="M 222 110 C 220 100, 228 100, 226 112" stroke="#2E7D32" stroke-width="5" fill="none"/>

      <!-- Red Tomato / Apple -->
      <circle cx="195" cy="170" r="24" fill="#E53935"/>
      <path d="M 195 146 Q 192 140 198 140" stroke="#2E7D32" stroke-width="4" fill="none"/>

      <!-- Red Apple with leaf -->
      <circle cx="310" cy="165" r="22" fill="#D32F2F"/>
      <ellipse cx="316" cy="144" rx="6" ry="3" fill="#388E3C" transform="rotate(-30, 316, 144)"/>

      <!-- Brown Grocery Crate inside Cart -->
      <rect x="130" y="155" width="180" height="70" rx="8" fill="#D4A373"/>
      <line x1="130" y1="180" x2="310" y2="180" stroke="#BC8A5F" stroke-width="3"/>

      <!-- Cart Handle & Basket Skeleton -->
      <!-- Handle -->
      <path d="M 65 135 L 125 185 L 140 185" stroke="#0F8A3E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Cart Main Basket -->
      <path d="M 130 185 L 320 220 L 305 320 L 160 320 Z" fill="none" stroke="url(#cartGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
      
      <!-- Basket Grid lines -->
      <line x1="165" y1="230" x2="180" y2="310" stroke="#0F8A3E" stroke-width="8" stroke-linecap="round"/>
      <line x1="210" y1="235" x2="220" y2="310" stroke="#0F8A3E" stroke-width="8" stroke-linecap="round"/>
      <line x1="255" y1="240" x2="260" y2="310" stroke="#0F8A3E" stroke-width="8" stroke-linecap="round"/>
      <line x1="145" y1="270" x2="295" y2="280" stroke="#0F8A3E" stroke-width="8" stroke-linecap="round"/>

      <!-- Cart Chassis & Wheels -->
      <path d="M 160 320 L 160 345 L 295 345" stroke="#0A6B2E" stroke-width="12" stroke-linecap="round" fill="none"/>
      
      <!-- Front & Back Wheels -->
      <circle cx="165" cy="365" r="22" fill="#1B4332"/>
      <circle cx="165" cy="365" r="10" fill="#E8F5E9"/>
      
      <circle cx="285" cy="365" r="22" fill="#1B4332"/>
      <circle cx="285" cy="365" r="10" fill="#E8F5E9"/>
    </g>

    <!-- RIGHT: TYPOGRAPHY & LOGO SCRIPT -->
    <g transform="translate(345, 20)">
      <!-- Leaf on top of 'U' -->
      <g transform="translate(425, 10)">
        <circle cx="10" cy="18" r="18" fill="#FF5722"/>
        <path d="M 18 55 C 30 15, 80 5, 95 12 C 85 45, 55 65, 18 55 Z" fill="#2E7D32"/>
        <path d="M 18 55 Q 55 35 95 12" stroke="#81C784" stroke-width="3" fill="none"/>
      </g>

      <!-- 'Unga' Calligraphy Text (Exact flowing green style) -->
      <text x="5" y="160" font-family="'Nunito', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="160" fill="url(#ungaGrad)" letter-spacing="-4">Unga</text>

      <!-- 'Market' Bold Red-Orange Text -->
      <text x="0" y="305" font-family="'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="145" fill="url(#marketGrad)" letter-spacing="-2">Market</text>

      <!-- Orange Shopping Bag with Cursor Clicker on right -->
      <g transform="translate(470, 195)">
        <!-- Bag Handle -->
        <path d="M 28 25 C 28 -5, 76 -5, 76 25" fill="none" stroke="#2D6A4F" stroke-width="8" stroke-linecap="round"/>
        <!-- Bag Body -->
        <path d="M 10 30 L 95 30 L 105 110 L 0 110 Z" fill="url(#bagGrad)" rx="8"/>
        <!-- Clicker Star burst -->
        <circle cx="45" cy="65" r="12" fill="#FFE082" opacity="0.6"/>
        <path d="M 45 45 L 45 85 M 25 65 L 65 65" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <!-- White Mouse Pointer Arrow -->
        <polygon points="50,65 85,85 70,88 80,105 70,110 60,92 50,100" fill="#FFFFFF" stroke="#D84315" stroke-width="2"/>
      </g>

      <!-- Tagline: "— Your Everyday, Our Priority! —" -->
      <g transform="translate(0, 335)">
        <line x1="0" y1="-7" x2="45" y2="-7" stroke="#1B4332" stroke-width="4" stroke-linecap="round"/>
        <text x="58" y="0" font-family="'Nunito', sans-serif" font-weight="800" font-size="28" fill="#1B4332" letter-spacing="1">Your Everyday, Our Priority!</text>
        <line x1="455" y1="-7" x2="505" y2="-7" stroke="#1B4332" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Orange Smile Curve Underneath -->
      <path d="M 120 355 Q 310 395 500 355" stroke="#FF5722" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- BOTTOM ROW: 5 CATEGORY BADGES -->
    <g transform="translate(50, 435)">
      <!-- 1. Fresh Produce -->
      <g transform="translate(0, 0)">
        <circle cx="35" cy="35" r="32" fill="#0A7C38"/>
        <!-- Leaf icon inside -->
        <path d="M 22 46 C 22 28, 42 20, 50 20 C 50 38, 38 48, 22 46 Z" fill="#FFFFFF"/>
        <path d="M 22 46 Q 36 34 50 20" stroke="#0A7C38" stroke-width="2" fill="none"/>
        <text x="80" y="30" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Fresh</text>
        <text x="80" y="52" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Produce</text>
      </g>

      <!-- Divider line -->
      <line x1="195" y1="15" x2="195" y2="55" stroke="#E5E7EB" stroke-width="2"/>

      <!-- 2. Grocery Essentials -->
      <g transform="translate(215, 0)">
        <circle cx="35" cy="35" r="32" fill="#E65100"/>
        <!-- Basket icon -->
        <path d="M 20 32 L 50 32 L 45 52 L 25 52 Z" fill="#FFFFFF"/>
        <path d="M 24 32 L 35 20 L 46 32" stroke="#FFFFFF" stroke-width="3" fill="none"/>
        <text x="80" y="30" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Grocery</text>
        <text x="80" y="52" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Essentials</text>
      </g>

      <!-- Divider line -->
      <line x1="415" y1="15" x2="415" y2="55" stroke="#E5E7EB" stroke-width="2"/>

      <!-- 3. Dairy & Beverages -->
      <g transform="translate(435, 0)">
        <circle cx="35" cy="35" r="32" fill="#0288D1"/>
        <!-- Bottle icon -->
        <path d="M 30 20 L 40 20 L 42 26 L 42 50 L 28 50 L 28 26 Z" fill="#FFFFFF"/>
        <text x="80" y="30" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Dairy &amp;</text>
        <text x="80" y="52" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Beverages</text>
      </g>

      <!-- Divider line -->
      <line x1="610" y1="15" x2="610" y2="55" stroke="#E5E7EB" stroke-width="2"/>

      <!-- 4. Home & Household -->
      <g transform="translate(630, 0)">
        <circle cx="35" cy="35" r="32" fill="#D32F2F"/>
        <!-- Spray spray bottle -->
        <path d="M 26 24 L 38 24 L 44 32 L 40 52 L 28 52 L 28 32 Z" fill="#FFFFFF"/>
        <path d="M 24 24 L 36 18" stroke="#FFFFFF" stroke-width="3"/>
        <text x="80" y="30" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Home &amp;</text>
        <text x="80" y="52" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Household</text>
      </g>

      <!-- Divider line -->
      <line x1="810" y1="15" x2="810" y2="55" stroke="#E5E7EB" stroke-width="2"/>

      <!-- 5. Personal Care -->
      <g transform="translate(830, 0)">
        <circle cx="35" cy="35" r="32" fill="#7B1FA2"/>
        <!-- Shampoo / Lotion pump -->
        <rect x="26" y="28" width="18" height="24" rx="4" fill="#FFFFFF"/>
        <path d="M 35 28 L 35 20 L 44 20" stroke="#FFFFFF" stroke-width="3" fill="none"/>
        <text x="80" y="30" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Personal</text>
        <text x="80" y="52" font-family="'Nunito', sans-serif" font-weight="800" font-size="19" fill="#111827">Care</text>
      </g>
    </g>
  </g>
</svg>
